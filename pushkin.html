<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПУШКИН.ОС v4.0 — СЦДБ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Courier New', monospace; background: #000; }

  #boot { position: fixed; inset: 0; background: #000; color: #4ade80;
    padding: 40px; font-size: 15px; line-height: 2; z-index: 10000; cursor: pointer; }
  #boot .line { opacity: 0; animation: fadeIn .25s forwards; }
  #boot .warn { color: #fbbf24; } #boot .ok { color: #4ade80; }
  @keyframes fadeIn { to { opacity: 1 } }
  #boot.hide { opacity: 0; pointer-events: none; transition: opacity .6s; }

  #desktop { position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 40%, #1b2a4a 0%, #070b14 100%); overflow: hidden; }
  #desktop::before { content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(212,175,55,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,175,55,.04) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; }

  #icons { position: absolute; top: 20px; left: 20px; display: flex; flex-direction: column;
    gap: 6px; width: 118px; z-index: 2; }
  .icon { position: relative; display: flex; flex-direction: column; align-items: center;
    padding: 8px 4px; border-radius: 6px; cursor: pointer; color: #e8e4d8; text-align: center;
    border: 1px solid transparent; transition: .12s; user-select: none; }
  .icon:hover { background: rgba(255,255,255,.07); border-color: rgba(212,175,55,.4); }
  .icon .glyph { font-size: 30px; line-height: 1; }
  .icon .label { font-size: 11px; margin-top: 5px; word-break: break-word; }
  .icon.fixed::after { content: '✓'; position: absolute; top: 4px; right: 10px;
    width: 18px; height: 18px; border-radius: 50%; background: #2d5a45; color: #d4af37;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    font-weight: bold; box-shadow: 0 0 8px rgba(74,222,128,.6); }
  .icon.secret { display: none; }
  .icon.secret.unlocked { display: flex; animation: pop .5s ease; }

  #windows { position: absolute; inset: 0; pointer-events: none; }
  .window { position: absolute; width: 520px; pointer-events: auto; background: #f4ecd8;
    border: 2px solid #12241d; border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(212,175,55,.25);
    overflow: hidden; animation: pop .16s ease; }
  @keyframes pop { from { transform: scale(.94); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .titlebar { background: linear-gradient(90deg, #12241d, #2d5a45); color: #d4af37;
    padding: 9px 12px; display: flex; justify-content: space-between; align-items: center;
    cursor: move; font-size: 13px; user-select: none; border-bottom: 1px solid rgba(212,175,55,.3); }
  .close { background: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; width: 22px;
    height: 22px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;
    line-height: 1; display: flex; align-items: center; justify-content: center; }
  .close:hover { background: #ef4444; color: #fff; }
  .window-body { padding: 16px; color: #262626; font-size: 13px; line-height: 1.55;
    max-height: 72vh; overflow-y: auto; }
  .window-body p { margin-bottom: 10px; }
  .portrait { width: 100%; height: 170px; margin-bottom: 14px; border-radius: 6px;
    background: repeating-linear-gradient(45deg, #e3d9c0, #e3d9c0 12px, #d8cdb0 12px, #d8cdb0 24px);
    border: 2px dashed #a89877; display: flex; align-items: center; justify-content: center;
    color: #6b6144; font-size: 11px; text-align: center; padding: 14px; line-height: 1.4; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
  .status { background: #0d0d0d; color: #f87171; padding: 7px 10px; font-size: 11px;
    border-radius: 4px; margin-bottom: 12px; border-left: 3px solid #ef4444; }
  .status.ok { color: #4ade80; border-left-color: #4ade80; }
  .question { font-weight: bold; margin: 12px 0 10px; color: #12241d; font-size: 13px; }
  .option { display: block; width: 100%; text-align: left; background: #fffdf5;
    border: 1px solid #c9bfa4; color: #262626; padding: 9px 12px; margin-bottom: 7px;
    border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 12px;
    transition: .12s; line-height: 1.4; }
  .option:hover:not(:disabled) { background: #fff8e0; border-color: #d4af37; transform: translateX(2px); }
  .option.correct { background: #d4f5d4; border-color: #2d5a45; color: #14532d; font-weight: bold; }
  .option.wrong { background: #fde0e0; border-color: #c0392b; color: #7f1d1d; animation: shake .3s; }
  .option:disabled { cursor: default; opacity: .85; }
  @keyframes shake { 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }
  .success-box { background: linear-gradient(135deg, #d4f5d4, #b8e6b8);
    border: 2px solid #2d5a45; border-radius: 6px; padding: 14px; margin-top: 12px;
    color: #14532d; font-size: 12px; animation: pop .3s ease; }
  .success-box b { display: block; margin-bottom: 6px; font-size: 13px; }
  .input-row { display: flex; gap: 8px; margin: 10px 0; }
  .input-row input { flex: 1; padding: 9px 12px; border: 2px solid #c9bfa4;
    border-radius: 5px; font-family: inherit; font-size: 13px; background: #fffdf5; color: #12241d; }
  .input-row input:focus { outline: none; border-color: #d4af37; }
  .btn { padding: 9px 16px; background: #d4af37; color: #12241d; border: none;
    border-radius: 5px; font-family: inherit; font-weight: bold; cursor: pointer; font-size: 12px; }
  .btn:hover { background: #e8c860; }
  .btn:disabled { opacity: .5; cursor: default; }

  #taskbar { position: absolute; bottom: 0; left: 0; right: 0; height: 42px;
    background: linear-gradient(180deg, #2d5a45, #12241d); border-top: 2px solid #d4af37;
    display: flex; align-items: center; padding: 0 12px; gap: 14px; color: #d4af37;
    font-size: 12px; z-index: 9998; box-shadow: 0 -4px 20px rgba(0,0,0,.5); }
  #start { padding: 7px 14px; background: #d4af37; color: #12241d; font-weight: bold;
    border-radius: 5px; cursor: pointer; font-size: 12px; letter-spacing: .5px;
    border: none; font-family: inherit; }
  #start:hover { background: #e8c860; }
  #progress { flex: 1; text-align: center; letter-spacing: 1px; font-size: 11px; }
  #achv { display: flex; gap: 4px; font-size: 16px; }
  #achv .a { opacity: .2; filter: grayscale(1); transition: .4s; cursor: help; }
  #achv .a.on { opacity: 1; filter: none; transform: scale(1.15); }
  #clock { font-variant-numeric: tabular-nums; opacity: .8; }
  #startmenu { position: absolute; bottom: 48px; left: 12px; background: #f4ecd8;
    border: 2px solid #12241d; border-radius: 8px; padding: 6px; display: none;
    min-width: 230px; z-index: 9999; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  #startmenu.open { display: block; animation: pop .15s ease; }
  #startmenu .mi { padding: 9px 12px; cursor: pointer; font-size: 12px; border-radius: 5px;
    color: #262626; display: flex; gap: 8px; align-items: center; }
  #startmenu .mi:hover { background: #d4af37; color: #12241d; }
  .final .titlebar { background: linear-gradient(90deg, #7a5c00, #d4af37); color: #12241d; }

  /* ТАРО */
  .tarot-spread { display: flex; gap: 8px; justify-content: center; margin: 14px 0; flex-wrap: wrap; }
  .tcard { width: 140px; height: 220px; perspective: 900px; cursor: pointer; position: relative; }
  .tcard-inner { position: absolute; inset: 0; transition: transform .7s;
    transform-style: preserve-3d; }
  .tcard.flipped .tcard-inner { transform: rotateY(180deg); }
  .tcard-face { position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 8px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 8px; text-align: center; font-size: 10px;
    border: 2px solid #12241d; }
  .tcard-front { background: linear-gradient(135deg, #12241d, #2d5a45); color: #d4af37; }
  .tcard-front .sym { font-size: 32px; margin-bottom: 6px; }
  .tcard-front .pos { font-size: 9px; letter-spacing: 2px; opacity: .8; margin-top: 6px; }
  .tcard-back { background: #fffdf5; color: #12241d; transform: rotateY(180deg);
    border-color: #d4af37; justify-content: flex-start; padding-top: 10px; overflow-y: auto; }
  .tcard-back .sym { font-size: 22px; }
  .tcard-back .nm { font-weight: bold; font-size: 11px; margin: 2px 0 4px; }
  .tcard-back .mn { font-size: 9px; line-height: 1.3; color: #4a4a4a; padding: 0 4px; }
  .reading { margin-top: 12px; padding: 12px; background: #fff8e0;
    border-left: 3px solid #d4af37; font-size: 12px; border-radius: 4px; display: none; }
  .reading.show { display: block; animation: pop .3s ease; }
  .reading h4 { font-size: 12px; color: #12241d; margin: 8px 0 4px; }
  .reading h4:first-child { margin-top: 0; }
  .reading .total { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #d4af37;
    font-style: italic; color: #7a5c00; }

  /* БАЛ */
  .ball-stage { background: linear-gradient(180deg, #2a1810, #0d0808);
    border-radius: 8px; padding: 18px; text-align: center; margin-bottom: 12px;
    border: 1px solid #d4af37; position: relative; overflow: hidden; }
  .ball-stage::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(212,175,55,.15) 0%, transparent 60%); }
  .ball-stage > * { position: relative; }
  .ball-round { color: #d4af37; font-size: 12px; letter-spacing: 2px; margin-bottom: 10px; }
  .ball-status { color: #e8e4d8; font-size: 12px; min-height: 22px; margin-bottom: 12px;
    font-style: italic; }
  .ball-moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ball-move { padding: 16px 8px; border-radius: 8px; border: 2px solid #12241d;
    background: #fffdf5; color: #12241d; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: bold; transition: .12s; display: flex;
    align-items: center; justify-content: center; gap: 8px; }
  .ball-move:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(212,175,55,.3); }
  .ball-move:disabled { opacity: .5; cursor: default; }
  .ball-move.lit { background: #d4af37; color: #12241d; transform: scale(1.05);
    box-shadow: 0 0 24px #d4af37; }
  .ball-move .ic { font-size: 22px; }

  /* ШИФР */
  .cipher-info { background: #f0e6cc; border-left: 3px solid #7a5c00; padding: 10px 12px;
    border-radius: 4px; font-size: 11px; margin-bottom: 12px; color: #4a3a10; line-height: 1.5; }
  .cipher-info b { color: #12241d; }
  .cipher-box { background: #0d0d0d; color: #4ade80; padding: 16px; border-radius: 6px;
    font-family: 'Courier New', monospace; font-size: 16px; letter-spacing: 3px;
    text-align: center; margin: 12px 0; border: 1px solid #2d5a45; word-break: break-all;
    line-height: 1.6; }
  .cipher-help { background: #fffdf5; border: 1px dashed #c9bfa4; padding: 10px;
    border-radius: 4px; font-size: 11px; color: #4a4a4a; margin: 10px 0; line-height: 1.5; }
  .cipher-help code { background: #f0e6cc; padding: 2px 6px; border-radius: 3px;
    font-family: 'Courier New', monospace; color: #12241d; }
  .cipher-result { margin-top: 12px; padding: 14px; background: #fff8e0;
    border-left: 3px solid #d4af37; border-radius: 4px; font-size: 12px;
    font-style: italic; color: #7a5c00; line-height: 1.6; }
  .cipher-result b { font-style: normal; color: #12241d; display: block; margin-bottom: 6px; }

  /* СООТНЕСИ */
  .match-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .match-col { display: flex; flex-direction: column; gap: 6px; }
  .match-item { padding: 9px 10px; background: #fffdf5; border: 2px solid #c9bfa4;
    border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 11px;
    text-align: left; transition: .12s; color: #262626; line-height: 1.35; }
  .match-item:hover:not(.matched) { border-color: #d4af37; background: #fff8e0; }
  .match-item.selected { background: #d4af37; color: #12241d; border-color: #7a5c00;
    font-weight: bold; }
  .match-item.matched { background: #d4f5d4; border-color: #2d5a45; color: #14532d;
    cursor: default; opacity: .85; }
  .match-item.wrong { animation: shake .3s; background: #fde0e0; border-color: #c0392b; }

  /* СЦДБ */
  .scdb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .scdb-node { background: #fffdf5; border: 2px solid #c9bfa4; border-radius: 8px;
    padding: 12px 8px; cursor: pointer; font-family: inherit; text-align: center;
    transition: .15s; color: #262626; }
  .scdb-node:hover { transform: translateY(-2px); border-color: #d4af37;
    box-shadow: 0 6px 18px rgba(0,0,0,.15); }
  .scdb-node.done { background: linear-gradient(135deg, #d4f5d4, #b8e6b8);
    border-color: #2d5a45; }
  .scdb-emoji { font-size: 26px; line-height: 1; margin-bottom: 4px; }
  .scdb-num { font-size: 10px; color: #6b6144; letter-spacing: 1px; }
  .scdb-name { font-size: 11px; font-weight: bold; margin: 2px 0; }
  .scdb-addr { font-size: 9px; color: #8a8065; }
  .scdb-off { font-size: 10px; color: #a89877; margin-top: 4px; }
  .scdb-check { font-size: 10px; color: #14532d; font-weight: bold; margin-top: 4px; }
  .ticket { margin-top: 14px; background: #fff8e0; border: 2px dashed #d4af37;
    border-radius: 8px; padding: 12px; }
  .ticket-head { font-weight: bold; color: #12241d; margin-bottom: 10px;
    font-size: 12px; text-align: center; letter-spacing: 1px; }
  .ticket-stamps { display: flex; justify-content: space-around; gap: 6px; }
  .stamp { width: 48px; height: 48px; border-radius: 50%; border: 2px dashed #c9bfa4;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 16px; color: #a89877; opacity: .4; transition: .3s;
    background: #fffdf5; }
  .stamp span { font-size: 8px; }
  .stamp.on { opacity: 1; border-style: solid; border-color: #2d5a45;
    color: #14532d; background: #d4f5d4; transform: rotate(-4deg); }
  .ticket-foot { text-align: center; margin-top: 10px; font-size: 11px; color: #6b6144; }

  /* ПРОФИЛЬ */
  .profile-card { padding: 16px; background: #fffdf5; border: 2px solid #c9bfa4;
    border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: .15s; }
  .profile-card:hover { border-color: #d4af37; transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,.15); }
  .profile-card h3 { font-size: 14px; color: #12241d; margin-bottom: 6px; }
  .profile-card p { font-size: 11px; color: #6b6144; line-height: 1.5; }
</style>
</head>
<body>

<div id="boot" onclick="this.classList.add('hide')"><div id="bootlog"></div></div>

<div id="desktop">
  <div id="icons"></div>
  <div id="windows"></div>
  <div id="taskbar">
    <button id="start">⊞ ПУШКИН.ОС</button>
    <div id="progress">Загрузка...</div>
    <div id="achv"></div>
    <div id="clock">--:--:--</div>
  </div>
  <div id="startmenu"></div>
</div>

<script>
/* =========================================================
   СОСТОЯНИЕ И ПРОФИЛЬ
   ========================================================= */
let PROFILE = localStorage.getItem('pushkin_profile') || null;
let zIndex = 10;

const fixedFiles = new Set(JSON.parse(localStorage.getItem('pushkin_fixedFiles') || '[]'));
const doneApps = new Set(JSON.parse(localStorage.getItem('pushkin_doneApps') || '[]'));
const doneBranches = new Set(JSON.parse(localStorage.getItem('pushkin_doneBranches') || '[]'));
const gotAchv = new Set(JSON.parse(localStorage.getItem('pushkin_gotAchv') || '[]'));

function saveState(){
  localStorage.setItem('pushkin_fixedFiles', JSON.stringify([...fixedFiles]));
  localStorage.setItem('pushkin_doneApps', JSON.stringify([...doneApps]));
  localStorage.setItem('pushkin_doneBranches', JSON.stringify([...doneBranches]));
  localStorage.setItem('pushkin_gotAchv', JSON.stringify([...gotAchv]));
}

function chooseProfile(){
  const win = document.createElement('div');
  win.className = 'window';
  win.dataset.id = 'profile';
  win.style.left = '50%'; win.style.top = '45%';
  win.style.transform = 'translate(-50%,-50%)';
  win.style.width = '520px';
  win.style.zIndex = ++zIndex;
  win.innerHTML = `
    <div class="titlebar"><span>👤 Выбор профиля администратора</span></div>
    <div class="window-body">
      <p style="margin-bottom:14px;">Прежде чем войти в систему, выбери свой путь. Это влияет на подсказки и строгость проверки.</p>
      <div class="profile-card" data-profile="intern">
        <h3>🎓 Стажёр</h3>
        <p>Подсказки включены. Ошибки не сбрасывают прогресс. Идеально для первого знакомства с системой.</p>
      </div>
      <div class="profile-card" data-profile="keeper">
        <h3>🗝️ Хранитель</h3>
        <p>Без подсказок. Ошибки в «порядке» сбрасывают шаг. Для тех, кто любит вызов.</p>
      </div>
    </div>`;
  document.getElementById('windows').appendChild(win);
  win.querySelectorAll('.profile-card').forEach(c => {
    c.addEventListener('click', () => {
      PROFILE = c.dataset.profile;
      localStorage.setItem('pushkin_profile', PROFILE);
      win.remove();
      toast('👤 Профиль выбран', PROFILE === 'intern' ? 'Стажёр' : 'Хранитель');
      initIcons(); // перерисовываем readme
    });
  });
}

/* =========================================================
   ФАЙЛЫ ПУШКИНА
   ========================================================= */
const FILES = [
  { id:'readme', name:'ПРОЧТИ_МЕНЯ.txt', icon:'📄', status:'ФАЙЛ ЧИТАЕМ', statusOk:true,
    portrait:'ЗДЕСЬ: коллаж — перо, чернильница, старая книга',
    intro:`<p><b>ПУШКИН.ОС v4.0</b> — операционная система литературного архива СЦДБ.</p>
      <p>Произошёл сбой: <b>6 файлов повреждены</b>. Имена файлов искажены — но внутри спрятаны герои и сюжеты. На рабочем столе также: <b>СЦДБ.Карта</b>, <b>Оракул</b>, <b>Бал</b> и <b>Тайнопись</b>.</p>
      <p>Восстанови 6 файлов, подключи 5 филиалов, пройди 3 программы — и откроется секретный архив.</p>
      <p style="opacity:.65;font-size:11px;margin-top:14px;">Выбран профиль: <b>${PROFILE === 'intern' ? '🎓 Стажёр' : '🗝️ Хранитель'}</b>. Сменить можно в меню «ПУШКИН.ОС».</p>`,
    task:null },

  { id:'onegin', name:'лишний_гость.exe', icon:'⚙️',
    status:'ERROR 0x1812: среди событий затесался чужак',
    portrait:'ЗДЕСЬ: бальный зал, силуэт в цилиндре, свечи',
    intro:'В памяти процесса — 6 событий. Пять из одного романа, одно — из другого произведения. Найди чужака.',
    task:{ type:'quiz', question:'Какое событие НЕ из «Евгения Онегина»?',
      options:[
        'Дуэль двух друзей из-за пустяка',
        'Письмо, написанное ночью у свечи',
        'Герой проигрывает три карты и сходит с ума',
        'Сон, в котором героиня видит медведя',
        'Отповедь героя в саду',
        'Встреча через годы в Петербурге'
      ],
      correct:2 },
    success:'Чужак найден. Это Германн из «Пиковой дамы». «Евгений Онегин» снова цел.' },

  { id:'skazka', name:'три_желания.exe', icon:'🐟',
    status:'КОНФЛИКТ: герои перепутали поступки',
    portrait:'ЗДЕСЬ: синее море, старик и старуха, разбитое корыто',
    intro:'Процесс перепутал, кто из героев что сделал. Восстанови справедливость.',
    task:{ type:'match', question:'Соотнеси героя и его поступок (из «Сказки о рыбаке и рыбке»)',
      pairs:[
        {left:'Старик', right:'Трижды закинул невод и поймал рыбку'},
        {left:'Старуха', right:'Захотела быть владычицей морскою'},
        {left:'Золотая рыбка', right:'Откупилась и вернулась в море'},
        {left:'Разбитое корыто', right:'Осталось у порога землянки'},
        {left:'Синее море', right:'Почернело от жадности'}
      ]
    },
    success:'Сказка восстановлена. «А перед нею разбитое корыто».' },

  { id:'poema', name:'голова_и_меч.exe', icon:'⚔️',

function makeIcon(id, icon, name){
  const el = document.createElement('div');
  el.className = 'icon';
  el.dataset.id = id;
  el.innerHTML = `<div class="glyph">${icon}</div><div class="label">${name}</div>`;
  el.addEventListener('click', () => openWindow(id));
  return el;
}

function initStartMenu(){
  const menu = document.getElementById('startmenu');
  menu.innerHTML = '';
  [...FILES, ...APPS.filter(a=>!a.secret)].forEach(f => {
    const mi = document.createElement('div');
    mi.className = 'mi';

    border:2px solid #d4af37;border-radius:8px;padding:12px 16px;font-size:12px;

}

function openWindow(id){
  const file = FILES.find(x => x.id === id);
  const app = APPS.find(x => x.id === id);
  if (app && app.secret && !canUnlockSecret()) {
    toast('🔒 Закрыто', 'Сначала: 6 файлов + 5 филиалов + 3 игры'); return;
  }
  const existing = document.querySelector(`.window[data-id="${id}"]`);
  if (existing) { focusWin(existing); return; }

  const count = document.querySelectorAll('.window').length;
  const win = document.createElement('div');
  win.className = 'window';
  win.dataset.id = id;
  win.style.left = (80 + (count % 6) * 32) + 'px';
  win.style.top  = (30  + (count % 6) * 32) + 'px';
  win.style.zIndex = ++zIndex;

  if (file) renderFile(win, file);
  else if (app) renderApp(win, app);

  document.getElementById('windows').appendChild(win);
  makeDraggable(win, win.querySelector('.titlebar'));
  win.querySelector('.close').addEventListener('click', () => win.remove());
  win.addEventListener('mousedown', () => focusWin(win));
}

function makeDraggable(win, handle){
  let ox=0, oy=0, dragging=false;
  handle.addEventListener('mousedown', e => {
    if (e.target.classList.contains('close')) return;
    dragging = true;
    ox = e.clientX - win.offsetLeft; oy = e.clientY - win.offsetTop;
    focusWin(win); e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    win.style.left = Math.max(0, Math.min(window.innerWidth - 100, e.clientX - ox)) + 'px';
    win.style.top  = Math.max(0, Math.min(window.innerHeight - 80, e.clientY - oy)) + 'px';
  });
  document.addEventListener('mouseup', () => dragging = false);
}
function focusWin(win){ win.style.zIndex = ++zIndex; }

function buildTaskHTML(task){
  if (task.type === 'quiz') {
    return `<div class="question">${task.question}</div>` +
      task.options.map((o,i) => `<button class="option" data-i="${i}">${o}</button>`).join('');
  }
  if (task.type === 'order') {
    const sh = task.lines.map((l,i)=>({l,i})).sort(()=>Math.random()-.5);
    return `<div class="question">${task.question}</div>` +
      sh.map(o => `<button class="option line" data-idx="${o.i}">${o.l}</button>`).join('');
  }
  if (task.type === 'match') {
    const lefts = task.pairs.map((p,i)=>({text:p.left, id:i}));
    const rights = task.pairs.map((p,i)=>({text:p.right, id:i})).sort(()=>Math.random()-.5);
    return `
      <div class="question">${task.question}</div>
      <div class="match-wrap">
        <div class="match-col" id="matchL">
          ${lefts.map(l => `<button class="match-item" data-side="L" data-id="${l.id}">${l.text}</button>`).join('')}
        </div>
        <div class="match-col" id="matchR">
          ${rights.map(r => `<button class="match-item" data-side="R" data-id="${r.id}">${r.text}</button>`).join('')}
        </div>
      </div>`;
  }
  return '';
}

function attachTaskHandler(win, task, onSolve){
  if (task.type === 'quiz') {
    win.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => {
        if (+btn.dataset.i === task.correct) {
          btn.classList.add('correct');
          win.querySelectorAll('.option').forEach(b => b.disabled = true);
          onSolve();
        } else {
          btn.classList.add('wrong'); btn.disabled = true;
          setTimeout(()=>btn.classList.remove('wrong'), 500);
        }
      });
    });
  }
  else if (task.type === 'order') {
    let step = 0;
    const lines = win.querySelectorAll('.line');
    lines.forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        if (+btn.dataset.idx === step) {
          btn.classList.add('correct'); btn.disabled = true; step++;
          if (step === task.lines.length) onSolve();
        } else {
          btn.classList.add('wrong');
          if (PROFILE === 'keeper') {
            setTimeout(() => {
              btn.classList.remove('wrong');
              step = 0;
              lines.forEach(b => { b.classList.remove('correct'); b.disabled = false; });
            }, 500);
          } else {
            setTimeout(()=>btn.classList.remove('wrong'), 500);
          }
        }
      });
    });
  }
  else if (task.type === 'match') {
    let selL = null, selR = null, matched = 0;
    const total = task.pairs.length;
    function tryMatch(){
      if (selL === null || selR === null) return;
      const btnL = win.querySelector(`#matchL [data-id="${selL}"]`);
      const btnR = win.querySelector(`#matchR [data-id="${selR}"]`);
      if (selL === selR) {
        btnL.classList.add('matched'); btnL.classList.remove('selected');
        btnR.classList.add('matched'); btnR.classList.remove('selected');
        matched++;
        if (matched === total) onSolve();
      } else {
        btnL.classList.add('wrong'); btnR.classList.add('wrong');
        setTimeout(() => {
          btnL.classList.remove('wrong','selected'); btnR.classList.remove('wrong','selected');
        }, 600);
      }
      selL = null; selR = null;
    }
    win.querySelectorAll('.match-item').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('matched')) return;
        const side = btn.dataset.side;
        if (side === 'L') {
          if (selL !== null) {
            const prev = win.querySelector(`#matchL [data-id="${selL}"]`);
            if (prev) prev.classList.remove('selected');
          }
          selL = +btn.dataset.id; btn.classList.add('selected');
        } else {
          if (selR !== null) {
            const prev = win.querySelector(`#matchR [data-id="${selR}"]`);
            if (prev) prev.classList.remove('selected');
          }
          selR = +btn.dataset.id; btn.classList.add('selected');
        }
        tryMatch();
      });
    });
  }
}

function renderBall(win){
  const moves = [
    {id:0, ic:'🎩', name:'Поклон'},
    {id:1, ic:'👗', name:'Реверанс'},
    {id:2, ic:'💃', name:'Пируэт'},

        <div class="ball-status" id="ballStatus">Смотри внимательно...</div>
        <div class="ball-moves" id="ballMoves">
          ${moves.map(m => `
            <button class="ball-move" data-id="${m.id}" disabled>
              <span class="ic">${m.ic}</span><span>${m.name}</span>
            </button>`).join('')}
        </div>
      </div>
    </div>`;

  const statusEl = win.querySelector('#ballStatus');
  const roundEl  = win.querySelector('#ballRound');
  const buttons  = win.querySelectorAll('.ball-move');

  function randomMove(){ return Math.floor(Math.random()*4); }

  function playSequence(){
    accepting = false;
    buttons.forEach(b => b.disabled = true);
    statusEl.textContent = 'Смотри внимательно...';
    let i = 0;
    const tick = setInterval(() => {
      if (i > 0) buttons.forEach(b => b.classList.remove('lit'));
      if (i >= sequence.length) {
        clearInterval(tick);
        buttons.forEach(b => b.classList.remove('lit'));
        accepting = true;
        userInput = [];
        buttons.forEach(b => b.disabled = false);
        statusEl.textContent = 'Твой ход!';
        return;
      }
      const btn = win.querySelector(`.ball-move[data-id="${sequence[i]}"]`);
      btn.classList.add('lit'); i++;
    }, 550);
  }

  function startRound(){
    sequence = [];
    for (let i = 0; i < level + 1; i++) sequence.push(randomMove());
    roundEl.textContent = `УРОВЕНЬ ${level} / ${maxLevel}`;
    setTimeout(playSequence, 500);
  }

  function finishWin(){
    const box = document.createElement('div');
    box.className = 'success-box';
    box.innerHTML = `<b>✓ БАЛ ЗАВЕРШЁН</b>Ты прошёл все фигуры. «...летит, летит; взглянуть назад не смеет».`;
    win.querySelector('.window-body').appendChild(box);
    buttons.forEach(b => b.disabled = true);
    statusEl.textContent = 'Победа!';
    if (!doneApps.has('ball')) { doneApps.add('ball'); saveState(); unlock('dancer'); updateProgress(); }
  }

  function finishLose(){
    const box = document.createElement('div');
    box.className = 'success-box';
    box.style.background = 'linear-gradient(135deg,#fde0e0,#fecaca)';
    box.style.borderColor = '#c0392b'; box.style.color = '#7f1d1d';
    box.innerHTML = `<b>✗ СБИЛСЯ С РИТМА</b>Попробуй ещё раз — просто открой «Бал.exe» заново.`;
    win.querySelector('.window-body').appendChild(box);
    buttons.forEach(b => b.disabled = true);
    statusEl.textContent = 'Конец танца.';
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (!accepting) return;
      const id = +btn.dataset.id;
      userInput.push(id);
      btn.classList.add('lit');
      setTimeout(() => btn.classList.remove('lit'), 200);

      const i = userInput.length - 1;
      if (userInput[i] !== sequence[i]) {
        accepting = false; buttons.forEach(b => b.disabled = true);
        setTimeout(finishLose, 500); return;
      }
      if (userInput.length === sequence.length) {
        accepting = false;
        if (level >= maxLevel) setTimeout(finishWin, 400);
        else {
          level++; statusEl.textContent = 'Отлично! Следующий уровень...';
          setTimeout(startRound, 900);
        }
      }
    });
  });
  startRound();
}

function caesarEncode(text, shift) {
  const alphabet = 'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
  return text.toUpperCase().split('').map(ch => {
    const idx = alphabet.indexOf(ch);
    if (idx === -1) return ch;
    return alphabet[(idx + shift) % alphabet.length];
  }).join('');
}

/* --- СЕКРЕТ --- */
function canUnlockSecret(){
  return fixedFiles.size === 6
    && doneApps.has('tarot')
    && doneApps.has('ball')
    && doneApps.has('cipher')
    && doneBranches.size === BRANCHES.length;
}

function checkAndUnlockSecret(){
  if (!canUnlockSecret()) return;
  const icon = document.querySelector('.icon.secret');
  if (icon && !icon.classList.contains('unlocked')) {
    icon.classList.add('unlocked');
    toast('📜 Секретный архив', 'Появился на рабочем столе');
  }
}

function renderSecret(win){
  win.classList.add('final');
  win.innerHTML = `
    <div class="titlebar"><span>📜 А.С.Пушкин.архив</span><button class="close">×</button></div>
    <div class="window-body">
      <div class="portrait">ЗДЕСЬ: Пушкин — перо, свеча, рукопись, заснеженное окно</div>
      <p><b>Все процессы работают штатно. Все файлы восстановлены. Все филиалы подключены.</b></p>
      <p>Герои вернулись на свои страницы. Строфы — на места. Бал отзвучал. Карты сданы. Сеть СЦДБ активна.</p>
      <p style="margin-top:14px; font-style:italic; color:#2d5a45;">
        «Что дружба? Лёгкий пыл похмелья...» — прошептал кто-то из глубины системы и растворился.
      </p>
      <p style="margin-top:18px;"><b>Спасибо, администратор. До новой сессии.</b></p>
    </div>`;
  if (!gotAchv.has('legend')) setTimeout(() => unlock('legend'), 400);
}

function updateProgress(){
  document.getElementById('progress').textContent =
    `Файлы: ${fixedFiles.size}/6 • Филиалы: ${doneBranches.size}/${BRANCHES.length} • Игры: ${doneApps.size}/3`;
}

/* ---------- ЗАПУСК ---------- */
initBoot();
initIcons();
initStartMenu();
renderAchv();
updateProgress();

setInterval(() => {
  const d = new Date(); const p = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}, 1000);

if (!PROFILE) {
  setTimeout(chooseProfile, 3000); // открываем выбор профиля после загрузки
} else {
  // обновляем readme
  setTimeout(() => {
    const readme = document.querySelector('.icon[data-id="readme"]');
    if (readme) readme.click();
    document.querySelector('.window[data-id="readme"]')?.remove();
  }, 3200);
}
</script>
</body>
</html>
