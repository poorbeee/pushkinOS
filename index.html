<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ПУШКИН.ОС v4.0 — СЦДБ</title>
<style>
  /* БАЗОВЫЕ НАСТРОЙКИ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; touch-action: manipulation; }
  body { font-family: Georgia, 'Times New Roman', serif; background: #0a120c; color: #2b2b2b; }

  #boot { position: fixed; inset: 0; background: #0a120c; color: #a3b5a9;
    padding: 20px; font-family: 'Courier New', monospace; font-size: 14px; line-height: 2; 
    z-index: 10000; cursor: pointer; overflow-y: auto; }
  #boot .line { opacity: 0; animation: fadeIn .25s forwards; }
  #boot .warn { color: #d1a352; } #boot .ok { color: #86a38e; }
  @keyframes fadeIn { to { opacity: 1 } }
  #boot.hide { opacity: 0; pointer-events: none; transition: opacity .6s; }

  /* РАБОЧИЙ СТОЛ */
  #desktop { position: fixed; inset: 0;
    background-color: #0d1710;
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(45deg, rgba(0,0,0,0.4) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.4) 75%, rgba(0,0,0,0.4)), 
      linear-gradient(45deg, rgba(0,0,0,0.4) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.4) 75%, rgba(0,0,0,0.4));
    background-size: 20px 20px, 20px 20px, 20px 20px;
    background-position: 0 0, 0 0, 10px 10px;
    overflow: hidden; transition: background-image 0.5s ease; }
  
  /* КОНТЕЙНЕР ИКОНОК */
  #icons { position: absolute; top: 20px; left: 15px; display: flex; flex-direction: column;
    gap: 12px; width: 120px; z-index: 2; bottom: 60px; overflow-y: auto; overflow-x: hidden; padding: 0 4px 10px 4px; }
  #icons::-webkit-scrollbar { width: 6px; }
  #icons::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
  #icons::-webkit-scrollbar-thumb { background: #2c4a35; border-radius: 3px; border: 1px solid #0a120c; }
  #icons::-webkit-scrollbar-thumb:hover { background: #86a38e; }

  .icon { position: relative; display: flex; flex-direction: column; align-items: center;
    padding: 8px 4px; cursor: pointer; color: #dce5df; text-align: center; width: 100%;
    border: 1px solid transparent; transition: none; user-select: none; }
  .icon:hover { background: rgba(255,255,255,.05); border: 1px dashed #86a38e; }
  .icon .glyph { font-size: 32px; line-height: 1; margin-bottom: 4px; filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.8)); }
  .icon .label { font-family: 'Courier New', monospace; font-size: 12px; text-shadow: 1px 1px 0 #000; 
    width: 100%; word-break: break-word; line-height: 1.2; }
  .icon.fixed::after { content: '✓'; position: absolute; top: 2px; right: 6px;
    width: 16px; height: 16px; background: #2c4a35; color: #a3b5a9;
    border: 1px solid #86a38e;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    font-family: sans-serif; box-shadow: 1px 1px 0 #000; }
  .icon.secret { display: none; }
  .icon.secret.unlocked { display: flex; }

  /* ОКНА */
  #windows { position: absolute; inset: 0; pointer-events: none; }
  .window { position: absolute; width: 600px; pointer-events: auto; background: #e8e0cc;
    border: 2px solid; border-color: #fff #000 #000 #fff; box-shadow: 4px 4px 0 rgba(0,0,0,0.8);
    overflow: hidden; display: flex; flex-direction: column; }
  
  .titlebar { background: #1a3324; color: #d1a352;
    padding: 6px 8px; display: flex; justify-content: space-between; align-items: center;
    cursor: move; font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; 
    user-select: none; border-bottom: 2px solid #000; flex-shrink: 0; }
  
  .close { background: #1a3324; color: #d1a352; border: 1px solid; border-color: #fff #000 #000 #fff; 
    width: 20px; height: 20px; cursor: pointer; font-weight: bold; font-size: 12px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: sans-serif; }
  .close:active { border-color: #000 #fff #fff #000; }
  
  .window-body { padding: 20px; color: #2b2b2b; font-size: 14px; line-height: 1.6;
    overflow-y: auto; flex-grow: 1; }
  .window-body p { margin-bottom: 12px; }
  
  /* БЛОК КАРТИНКИ */
  .portrait { width: 100%; height: 300px; margin-bottom: 16px;
    border: 2px solid; border-color: #8b7d5b #fff #fff #8b7d5b;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0; background: #dcd3bd; padding: 4px; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }

  .status { background: #2b2b2b; color: #a3b5a9; padding: 8px 10px; font-size: 12px;
    font-family: 'Courier New', monospace; margin-bottom: 16px; border: 2px solid;
    border-color: #000 #fff #fff #000; }
  .status.ok { color: #86a38e; }

  .question { font-weight: bold; margin: 16px 0 12px; color: #1a3324; font-size: 15px; }
  .option { display: block; width: 100%; text-align: left; background: #dcd3bd;
    border: 1px solid #8b7d5b; color: #2b2b2b; padding: 10px 12px; margin-bottom: 8px;
    cursor: pointer; font-family: inherit; font-size: 14px;
    box-shadow: 2px 2px 0 #8b7d5b; transition: none; line-height: 1.4; }
  .option:hover:not(:disabled) { background: #e8e0cc; border-color: #2c4a35; box-shadow: 2px 2px 0 #2c4a35; }
  .option:active:not(:disabled) { box-shadow: none; transform: translate(2px, 2px); }
  .option.correct { background: #b8d4be; border-color: #2c4a35; color: #0a120c; box-shadow: none; font-weight: bold; }
  .option.wrong { background: #e6c1c1; border-color: #7a2323; color: #4a0e0e; box-shadow: none; animation: shake .3s; }
  .option:disabled { cursor: default; opacity: 0.7; }
  @keyframes shake { 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }
  
  .success-box { background: #b8d4be; border: 2px solid; border-color: #fff #2c4a35 #2c4a35 #fff;
    padding: 14px; margin-top: 16px; color: #0a120c; font-size: 13px; }
  .success-box b { display: block; margin-bottom: 6px; font-size: 14px; font-family: 'Courier New', monospace; }

  .input-row { display: flex; gap: 8px; margin: 12px 0; }
  .input-row input { flex: 1; padding: 8px 10px; border: 2px solid; border-color: #8b7d5b #fff #fff #8b7d5b;
    font-family: 'Courier New', monospace; font-size: 14px; background: #fffdf5; color: #1a3324; }
  .input-row input:focus { outline: none; background: #fff; border-color: #2c4a35 #fff #fff #2c4a35; }
  
  .btn { padding: 8px 16px; background: #1a3324; color: #d1a352; border: 2px solid; 
    border-color: #2c4a35 #000 #000 #2c4a35; cursor: pointer; font-family: 'Courier New', monospace; 
    font-weight: bold; font-size: 13px; flex-shrink: 0; }
  .btn:active { border-color: #000 #2c4a35 #2c4a35 #000; background: #0d1710; }
  .btn:disabled { background: #556b5b; color: #a3b5a9; border-color: #556b5b; cursor: default; }
  .btn.small { padding: 4px 8px; font-size: 11px; }

  /* ПАНЕЛЬ ЗАДАЧ */
  #taskbar { position: absolute; bottom: 0; left: 0; right: 0; height: 44px;
    background: #1a1a1a; border-top: 2px solid #444;
    display: flex; align-items: center; padding: 0 6px; gap: 8px; color: #c0c0c0;
    font-family: 'Courier New', monospace; font-size: 12px; z-index: 9998; }
  #start { padding: 4px 12px; background: #1a3324; color: #d1a352; font-weight: bold;
    border: 2px solid; border-color: #2c4a35 #000 #000 #2c4a35; cursor: pointer; font-size: 13px;
    font-family: inherit; display: flex; align-items: center; gap: 6px; height: 32px; }
  #start:active { border-color: #000 #2c4a35 #2c4a35 #000; background: #0d1710; }
  #progress { flex: 1; text-align: left; letter-spacing: 1px; font-size: 12px; white-space: nowrap; 
    overflow: hidden; text-overflow: ellipsis; padding-left: 10px; color: #86a38e; }
    
  /* АЧИВКИ */
  #achv { display: flex; gap: 6px; font-size: 16px; margin-right: 10px; }
  #achv .a { opacity: .3; filter: grayscale(1); cursor: help; transition: .3s; }
  #achv .a.on { opacity: 1; filter: none; transform: scale(1.1); }
  
  #clock { font-variant-numeric: tabular-nums; background: #1a1a1a; border: 1px solid; border-color: #000 #444 #444 #000;
    padding: 4px 12px; color: #e8e0cc; font-size: 12px; }
  
  #startmenu { position: absolute; bottom: 48px; left: 6px; background: #e8e0cc;
    border: 2px solid; border-color: #fff #000 #000 #fff; padding: 4px; display: none;
    min-width: 240px; z-index: 9999; box-shadow: 4px 4px 0 rgba(0,0,0,0.8); max-height: 70vh; overflow-y: auto; }
  #startmenu.open { display: block; }
  #startmenu .mi { padding: 8px 12px; cursor: pointer; font-size: 13px; color: #1a3324; display: flex; gap: 10px; align-items: center; }
  #startmenu .mi:hover { background: #1a3324; color: #d1a352; }
  .final .titlebar { background: #4a3b16; color: #d1a352; }

  /* ТАРО */
  .tarot-spread { display: flex; gap: 10px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
  .tcard { width: 140px; height: 210px; perspective: 900px; cursor: pointer; position: relative; }
  .tcard-inner { position: absolute; inset: 0; transition: transform .6s; transform-style: preserve-3d; }
  .tcard.flipped .tcard-inner { transform: rotateY(180deg); }
  .tcard-face { position: absolute; inset: 0; backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; text-align: center; font-size: 11px; border: 2px solid; }
  .tcard-front { background: #1a3324; color: #d1a352; border-color: #86a38e #000 #000 #86a38e; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
  .tcard-front .sym { font-size: 36px; margin-bottom: 8px; filter: drop-shadow(0 0 5px rgba(209, 163, 82, 0.5)); }
  .tcard-front .pos { font-size: 10px; letter-spacing: 2px; opacity: .9; margin-top: 6px; font-family: 'Courier New', monospace;}
  .tcard-back { background: #e8e0cc; color: #1a3324; transform: rotateY(180deg); border-color: #8b7d5b #fff #fff #8b7d5b; justify-content: flex-start; padding-top: 12px; overflow-y: auto; }
  .tcard-back .sym { font-size: 24px; }
  .tcard-back .nm { font-weight: bold; font-size: 12px; margin: 4px 0 6px; }
  .tcard-back .mn { font-size: 10px; line-height: 1.3; color: #4a4a4a; padding: 0 6px; }
  .reading { margin-top: 16px; padding: 14px; background: #dcd3bd; border: 2px solid; border-color: #8b7d5b #fff #fff #8b7d5b; font-size: 13px; display: none; }
  .reading.show { display: block; }
  .reading h4 { font-size: 14px; color: #1a3324; margin: 10px 0 6px; }
  .reading h4:first-child { margin-top: 0; }
  .reading .total { margin-top: 12px; padding-top: 12px; border-top: 2px dashed #8b7d5b; font-style: italic; color: #1a3324; }

  /* БАЛ */
  .ball-stage { background: #1a3324; border: 2px solid; border-color: #000 #86a38e #86a38e #000; padding: 16px; text-align: center; margin-bottom: 16px; }
  .ball-round { color: #d1a352; font-family: 'Courier New', monospace; font-size: 14px; letter-spacing: 2px; margin-bottom: 10px; }
  .ball-status { color: #e8e0cc; font-size: 13px; min-height: 22px; margin-bottom: 12px; font-style: italic; }
  .ball-moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ball-move { padding: 12px 8px; background: #dcd3bd; color: #1a3324; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: bold; border: 2px solid; border-color: #fff #8b7d5b #8b7d5b #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: none; }
  .ball-move:active:not(:disabled) { border-color: #8b7d5b #fff #fff #8b7d5b; }
  .ball-move:disabled { opacity: .5; cursor: default; }
  .ball-move.lit { background: #d1a352; color: #1a3324; border-color: #fff #8b7d5b #8b7d5b #fff; box-shadow: inset 0 0 15px rgba(255,255,255,0.5); }
  .ball-move .ic { font-size: 24px; }

  /* ШИФР */
  .cipher-info { background: #1a3324; color: #d1a352; border: 2px solid; border-color: #fff #000 #000 #fff; padding: 10px 14px; font-size: 12px; font-family: 'Courier New', monospace; margin-bottom: 16px; line-height: 1.5; }
  .cipher-box { background: #0d1710; color: #86a38e; padding: 16px; font-family: 'Courier New', monospace; font-size: 16px; letter-spacing: 2px; text-align: center; margin: 16px 0; border: 2px solid; border-color: #000 #86a38e #86a38e #000; white-space: pre-wrap; word-wrap: break-word; line-height: 1.8; }
  
  /* Стиль для эмодзи-ребуса */
  .cipher-emoji { font-size: 28px; letter-spacing: 8px; padding: 20px 10px; line-height: 1.6; }

  .cipher-help { background: #dcd3bd; border: 1px dashed #8b7d5b; padding: 12px; font-size: 12px; color: #2b2b2b; margin: 12px 0; line-height: 1.5; }
  .cipher-help code { background: #e8e0cc; padding: 2px 6px; font-family: 'Courier New', monospace; color: #1a3324; border: 1px solid #8b7d5b; }
  .cipher-result { margin-top: 16px; padding: 16px; background: #fffdf5; border: 2px solid; border-color: #8b7d5b #fff #fff #8b7d5b; font-size: 14px; font-style: italic; color: #1a3324; line-height: 1.6; }
  .cipher-result b { font-style: normal; display: block; margin-bottom: 8px; font-family: 'Courier New', monospace; }

  /* СООТНЕСИ */
  .match-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .match-col { display: flex; flex-direction: column; gap: 8px; }
  .match-item { padding: 10px 12px; background: #dcd3bd; border: 2px solid; border-color: #fff #8b7d5b #8b7d5b #fff; cursor: pointer; font-family: inherit; font-size: 12px; text-align: left; color: #2b2b2b; line-height: 1.35; transition: none; }
  .match-item:hover:not(.matched) { border-color: #fff #1a3324 #1a3324 #fff; background: #e8e0cc; }
  .match-item.selected { background: #d1a352; color: #1a3324; border-color: #fff #4a3b16 #4a3b16 #fff; font-weight: bold; }
  .match-item.matched { background: #b8d4be; border-color: #fff #2c4a35 #2c4a35 #fff; color: #0a120c; cursor: default; opacity: .9; }
  .match-item.wrong { animation: shake .3s; background: #e6c1c1; border-color: #fff #7a2323 #7a2323 #fff; }

  /* СЦДБ */
  .scdb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .scdb-node { background: #dcd3bd; border: 2px solid; border-color: #fff #8b7d5b #8b7d5b #fff; padding: 10px 6px; cursor: pointer; font-family: inherit; text-align: center; color: #2b2b2b; }
  .scdb-node:hover { background: #e8e0cc; }
  .scdb-node:active { border-color: #8b7d5b #fff #fff #8b7d5b; }
  .scdb-node.done { background: #b8d4be; border-color: #fff #2c4a35 #2c4a35 #fff; }
  .scdb-emoji { font-size: 24px; margin-bottom: 6px; filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.3)); }
  .scdb-num { font-family: 'Courier New', monospace; font-size: 11px; color: #4a3b16; font-weight: bold; }
  .scdb-name { font-size: 12px; font-weight: bold; margin: 4px 0; }
  .scdb-addr { font-size: 10px; color: #5a5a5a; }
  .scdb-off { font-family: 'Courier New', monospace; font-size: 10px; color: #7a2323; margin-top: 6px; }
  .scdb-check { font-family: 'Courier New', monospace; font-size: 10px; color: #0a120c; font-weight: bold; margin-top: 6px; }

  .ticket { margin-top: 20px; background: #fffdf5; border: 2px dashed #8b7d5b; padding: 12px; }
  .ticket-head { font-weight: bold; color: #1a3324; margin-bottom: 12px; font-size: 13px; text-align: center; letter-spacing: 1px; }
  .ticket-stamps { display: flex; justify-content: space-around; gap: 6px; flex-wrap: wrap; }
  .stamp { width: 42px; height: 42px; border-radius: 50%; border: 2px dashed #8b7d5b; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; color: #8b7d5b; opacity: .4; background: #e8e0cc; }
  .stamp span { font-family: 'Courier New', monospace; font-size: 9px; margin-top: 2px; }
  .stamp.on { opacity: 1; border-style: solid; border-color: #2c4a35; color: #1a3324; background: #b8d4be; }
  .ticket-foot { text-align: center; margin-top: 12px; font-size: 12px; color: #4a3b16; font-weight: bold; }

  /* НАСТРОЙКИ (ОБОИ) */
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .wp-card { background: #dcd3bd; border: 2px solid; border-color: #fff #8b7d5b #8b7d5b #fff; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .wp-card.locked { opacity: 0.6; background: #c4bba7; }
  .wp-preview { width: 100%; height: 80px; background: #1a3324; border: 1px solid #8b7d5b; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .wp-preview img { width: 100%; height: 100%; object-fit: cover; }
  .wp-lock { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #d1a352; font-weight: bold; font-family: 'Courier New', monospace; font-size: 11px; text-align: center; padding: 4px; }
  .wp-lock .ic { font-size: 20px; margin-bottom: 4px; }
  .wp-actions { display: flex; gap: 4px; }
  .wp-actions button { flex: 1; }
  
  /* ДОСТИЖЕНИЯ (СПИСОК) */
  .achv-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .achv-card { background: #dcd3bd; border: 2px solid; border-color: #fff #8b7d5b #8b7d5b #fff; padding: 10px; display: flex; align-items: center; gap: 10px; opacity: 0.5; filter: grayscale(1); }
  .achv-card.unlocked { opacity: 1; filter: none; background: #e8e0cc; border-color: #fff #2c4a35 #2c4a35 #fff; }
  .achv-card .a-icon { font-size: 28px; flex-shrink: 0; }
  .achv-card .a-info h4 { font-size: 13px; color: #1a3324; font-family: 'Courier New', monospace; margin-bottom: 2px; }
  .achv-card .a-info p { font-size: 11px; color: #4a4a4a; line-height: 1.3; margin: 0; }
  
  /* ПРОФИЛЬ */
  .profile-card { padding: 16px; background: #dcd3bd; border: 2px solid; border-color: #fff #8b7d5b #8b7d5b #fff; margin-bottom: 12px; cursor: pointer; transition: none; }
  .profile-card:hover { background: #e8e0cc; }
  .profile-card:active { border-color: #8b7d5b #fff #fff #8b7d5b; }
  .profile-card h3 { font-size: 16px; color: #1a3324; margin-bottom: 8px; font-family: 'Courier New', monospace; }
  .profile-card p { font-size: 13px; color: #2b2b2b; line-height: 1.5; }

  /* МОБИЛЬНАЯ ВЕРСИЯ */
  @media (max-width: 768px) {
    #icons { position: absolute; top: 10px; left: 10px; right: 10px; bottom: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: auto; overflow-y: visible; padding-bottom: 0; z-index: 10; }
    .icon { padding: 10px 4px; background: rgba(13, 23, 16, 0.8); border: 1px solid #2c4a35; }
    .window { position: absolute; left: 50% !important; top: 50% !important; transform: translate(-50%, -50%) !important; width: calc(100% - 16px) !important; max-height: calc(100% - 80px) !important; margin: 0; box-shadow: 6px 6px 0 rgba(0,0,0,0.8); }
    .titlebar { cursor: default; padding: 8px 10px; font-size: 14px; }
    .close { width: 24px; height: 24px; }
    .window-body { padding: 16px; font-size: 14px; }
    
    .portrait { height: 240px; }
    
    #taskbar { height: 50px; gap: 6px; padding: 0 6px; }
    #start { padding: 6px 10px; font-size: 12px; height: 36px; }
    #progress { font-size: 11px; padding-left: 4px; }
    #achv { display: none; }
    
    .option { padding: 12px; font-size: 14px; }
    .input-row { flex-direction: column; gap: 10px; }
    .btn { width: 100%; padding: 12px; font-size: 15px; }
    .input-row input { padding: 10px; font-size: 15px; }
    .tarot-spread { gap: 8px; }
    .tcard { width: 31%; height: 180px; }
    .tcard-back .mn { font-size: 9px; }
    .match-wrap { grid-template-columns: 1fr; gap: 12px; }
    .match-item { font-size: 13px; padding: 12px; }
    .scdb-grid { grid-template-columns: 1fr; gap: 8px; }
    .ball-move { padding: 14px 8px; font-size: 14px; }
    .cipher-box { font-size: 14px; letter-spacing: 1px; padding: 12px; }
    .cipher-emoji { font-size: 24px; letter-spacing: 4px; }
    .settings-grid { grid-template-columns: 1fr; }
    .achv-list { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="boot" onclick="this.classList.add('hide')"><div id="bootlog"></div></div>

<div id="desktop">
  <div id="icons"></div>
  <div id="windows"></div>

function applyWallpaper() {
  const wp = WALLPAPERS.find(w => w.id === CURRENT_WALLPAPER) || WALLPAPERS[0];
  const desk = document.getElementById('desktop');
  const isMobile = window.innerWidth <= 768;
  const imgUrl = isMobile ? wp.mobileUrl : wp.url;

  if (imgUrl) {
    desk.style.backgroundImage = `url('${imgUrl}')`;
    desk.style.backgroundSize = 'cover';
    desk.style.backgroundPosition = 'center';
  } else {
    desk.style.backgroundImage = `
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 1px, transparent 1px),

    `;
    desk.style.backgroundSize = '20px 20px, 20px 20px, 20px 20px';
  }
}

function chooseProfile(){
  const win = document.createElement('div');
  win.className = 'window';
  win.dataset.id = 'profile';
  win.style.width = '90%'; win.style.maxWidth = '500px';
  win.style.left = '50%'; win.style.top = '45%';
  win.style.transform = 'translate(-50%,-50%)';
  win.style.zIndex = ++zIndex;
  win.innerHTML = `
    <div class="titlebar"><span>👤 Выбор профиля</span></div>
    <div class="window-body">
      <p style="margin-bottom:16px;">Прежде чем войти, выбери свой путь.</p>
      <div class="profile-card" data-profile="intern">
        <h3>🎓 Стажёр</h3>
        <p>Подсказки включены. Ошибки не сбрасывают прогресс. Идеально для знакомства.</p>
      </div>
      <div class="profile-card" data-profile="keeper">
        <h3>🗝️ Хранитель</h3>
        <p>Без подсказок. Ошибки в «порядке» сбрасывают шаг. Для любителей вызова.</p>
      </div>
    </div>`;
  document.getElementById('windows').appendChild(win);
  win.querySelectorAll('.profile-card').forEach(c => {
    c.addEventListener('click', () => {
      PROFILE = c.dataset.profile;
      localStorage.setItem('pushkin_profile', PROFILE);
      win.remove();
      toast('👤 Профиль выбран', PROFILE === 'intern' ? 'Стажёр' : 'Хранитель');
      initIcons();
    });
  });
}

  wrap.innerHTML = '';

function makeIcon(id, icon, name){
  const el = document.createElement('div');
  el.className = 'icon';
  el.dataset.id = id;
  el.innerHTML = `<div class="glyph">${icon}</div><div class="label">${name}</div>`;
  el.addEventListener('click', () => openWindow(id));
  return el;
}

function openWindow(id){
  const file = FILES.find(x => x.id === id);
  const app = APPS.find(x => x.id === id);
  if (app && app.secret && !canUnlockSecret()) {
    toast('🔒 Закрыто', 'Сначала: 6 файлов + 5 филиалов + 3 игры'); return;
  }
  const existing = document.querySelector(`.window[data-id="${id}"]`);
  if (existing) { focusWin(existing); return; }

  const isMobile = window.innerWidth <= 768;
  const count = document.querySelectorAll('.window').length;
  const win = document.createElement('div');
  win.className = 'window';
  win.dataset.id = id;
  
  if (!isMobile) {
    win.style.left = (80 + (count % 6) * 32) + 'px';
    win.style.top  = (30  + (count % 6) * 32) + 'px';
  }
  win.style.zIndex = ++zIndex;

  if (file) renderFile(win, file);
  else if (app) renderApp(win, app);

  document.getElementById('windows').appendChild(win);
  
  if (!isMobile) makeDraggable(win, win.querySelector('.titlebar'));
  win.querySelector('.close').addEventListener('click', () => win.remove());
  if (!isMobile) win.addEventListener('mousedown', () => focusWin(win));
}

function makeDraggable(win, handle){
  let ox=0, oy=0, dragging=false;
  handle.addEventListener('mousedown', e => {
    if (e.target.classList.contains('close')) return;
    dragging = true;
    ox = e.clientX - win.offsetLeft; oy = e.clientY - win.offsetTop;
    focusWin(win); e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    win.style.left = Math.max(0, Math.min(window.innerWidth - 100, e.clientX - ox)) + 'px';
    win.style.top  = Math.max(0, Math.min(window.innerHeight - 80, e.clientY - oy)) + 'px';
  });
  document.addEventListener('mouseup', () => dragging = false);
}
function focusWin(win){ win.style.zIndex = ++zIndex; }

function buildTaskHTML(task){
  if (task.type === 'quiz') {
    return `<div class="question">${task.question}</div>` +
      task.options.map((o,i) => `<button class="option" data-i="${i}">${o}</button>`).join('');
  }
  if (task.type === 'order') {
    const sh = task.lines.map((l,i)=>({l,i})).sort(()=>Math.random()-.5);
    return `<div class="question">${task.question}</div>` +
      sh.map(o => `<button class="option line" data-idx="${o.i}">${o.l}</button>`).join('');
  }
  if (task.type === 'match') {
    const lefts = task.pairs.map((p,i)=>({text:p.left, id:i}));
    const rights = task.pairs.map((p,i)=>({text:p.right, id:i})).sort(()=>Math.random()-.5);
    return `
      <div class="question">${task.question}</div>
      <div class="match-wrap">
        <div class="match-col" id="matchL">
          ${lefts.map(l => `<button class="match-item" data-side="L" data-id="${l.id}">${l.text}</button>`).join('')}
        </div>
        <div class="match-col" id="matchR">
          ${rights.map(r => `<button class="match-item" data-side="R" data-id="${r.id}">${r.text}</button>`).join('')}
        </div>
      </div>`;
  }
  return '';
}

function attachTaskHandler(win, task, onSolve){
  if (task.type === 'quiz') {
    win.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => {
        if (+btn.dataset.i === task.correct) {
          btn.classList.add('correct');
          win.querySelectorAll('.option').forEach(b => b.disabled = true);
          onSolve();
        } else {
          btn.classList.add('wrong'); btn.disabled = true;
          setTimeout(()=>btn.classList.remove('wrong'), 500);
        }
      });
    });
  }
  else if (task.type === 'order') {
    let step = 0;
    const lines = win.querySelectorAll('.line');
    lines.forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        if (+btn.dataset.idx === step) {
          btn.classList.add('correct'); btn.disabled = true; step++;
          if (step === task.lines.length) onSolve();
        } else {
          btn.classList.add('wrong');
          if (PROFILE === 'keeper') {
            setTimeout(() => {
              btn.classList.remove('wrong');
              step = 0;
              lines.forEach(b => { b.classList.remove('correct'); b.disabled = false; });
            }, 500);
          } else {
            setTimeout(()=>btn.classList.remove('wrong'), 500);
          }
        }
      });
    });
  }
  else if (task.type === 'match') {
    let selL = null, selR = null, matched = 0;
    const total = task.pairs.length;
    function tryMatch(){
      if (selL === null || selR === null) return;
      const btnL = win.querySelector(`#matchL [data-id="${selL}"]`);
      const btnR = win.querySelector(`#matchR [data-id="${selR}"]`);
      if (selL === selR) {
        btnL.classList.add('matched'); btnL.classList.remove('selected');
        btnR.classList.add('matched'); btnR.classList.remove('selected');
        matched++;
        if (matched === total) onSolve();
      } else {
        btnL.classList.add('wrong'); btnR.classList.add('wrong');
        setTimeout(() => {
          btnL.classList.remove('wrong','selected'); btnR.classList.remove('wrong','selected');
        }, 600);
      }
      selL = null; selR = null;
    }
    win.querySelectorAll('.match-item').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.classList.contains('matched')) return;
        const side = btn.dataset.side;
        if (side === 'L') {
          if (selL !== null) {
            const prev = win.querySelector(`#matchL [data-id="${selL}"]`);
            if (prev) prev.classList.remove('selected');
          }
          selL = +btn.dataset.id; btn.classList.add('selected');
        } else {
          if (selR !== null) {
            const prev = win.querySelector(`#matchR [data-id="${selR}"]`);
            if (prev) prev.classList.remove('selected');
          }
          selR = +btn.dataset.id; btn.classList.add('selected');
        }
        tryMatch();
      });
    });
  }
}

  box.innerHTML = `<b>✓ ФАЙЛ ВОССТАНОВЛЕН</b>${f.success}`;

  win.querySelector('.status').classList.add('ok');
  win.querySelector('.status').textContent = 'СТАТУС: OK';

    fixedFiles.add(f.id); saveState();

    unlock('poet');

function openBranch(b, parentWin){
  const id = 'branch-' + b.id;
  if (document.querySelector(`.window[data-id="${id}"]`)) return;
  const isMobile = window.innerWidth <= 768;
  const count = document.querySelectorAll('.window').length;
  const win = document.createElement('div');
  win.className = 'window';
  win.dataset.id = id;
  
  if (!isMobile) {
    win.style.left = (140 + (count%5)*30) + 'px';
    win.style.top  = (40  + (count%5)*30) + 'px';
    win.style.width = '480px';
  }
  win.style.zIndex = ++zIndex;

  win.innerHTML = `
    <div class="titlebar"><span>${b.emoji} ${b.name}</span><button class="close">×</button></div>
    <div class="window-body">
      <div class="status">${b.emoji} ${b.addr}</div>
      <p>${b.intro}</p>
      ${buildTaskHTML(b.task)}
    </div>`;

  document.getElementById('windows').appendChild(win);
  if (!isMobile) makeDraggable(win, win.querySelector('.titlebar'));
  win.querySelector('.close').addEventListener('click', () => win.remove());
  if (!isMobile) win.addEventListener('mousedown', () => focusWin(win));

  attachTaskHandler(win, b.task, () => branchSolved(b, win, parentWin));
}

function branchSolved(b, win, parentWin){
  const box = document.createElement('div');
  box.className = 'success-box';
  box.innerHTML = `<b>✓ СВЯЗЬ УСТАНОВЛЕНА</b>${b.success}`;
  win.querySelector('.window-body').appendChild(box);

  doneBranches.add(b.id); saveState();

  const node = parentWin.querySelector(`.scdb-node[data-id="${b.id}"]`);
  if (node) {
    node.classList.add('done');
    node.querySelector('.scdb-check, .scdb-off').outerHTML = '<div class="scdb-check">✓ подключён</div>';
  }
  const stamp = parentWin.querySelectorAll('.stamp')[BRANCHES.findIndex(x=>x.id===b.id)];
  if (stamp) stamp.classList.add('on');
  const foot = parentWin.querySelector('#ticketFoot');
  if (foot) foot.innerHTML = `Подключено: <b>${doneBranches.size} / ${BRANCHES.length}</b>`;

  toast(`✓ ${b.num} подключён`, b.name);

  if (doneBranches.size === BRANCHES.length && !gotAchv.has('reader')) {
    unlock('reader'); checkAndUnlockSecret();
  }
  updateProgress();
}

/* --- ТАРО --- */
function renderTarot(win){
  const positions = [...TAROT_POSITIONS].sort(()=>Math.random()-.5).slice(0,3);
  const spread = [];
  const pool = [...TAROT];
  for(let i=0; i<3; i++){
    const idx = Math.floor(Math.random() * pool.length);
    spread.push({...pool[idx], pos: positions[i]});
    pool.splice(idx, 1);
  }

  win.innerHTML = `
    <div class="titlebar"><span>🎴 Оракул.exe</span><button class="close">×</button></div>
    <div class="window-body">
      <div class="portrait"><img src="img/1.jpg" alt="Гадалка"></div>
      <p style="text-align:center;font-style:italic;color:#4a3b16;">
        Задай вопрос и вытяни три карты.<br>
        Расклад: <b>${positions.join(' • ')}</b>
      </p>
      <div class="input-row">
        <input type="text" id="tarotQ" placeholder="Твой вопрос к Оракулу...">
      </div>
      <div class="tarot-spread" id="spread">
        ${spread.map((c,i) => `
          <div class="tcard" data-i="${i}">
            <div class="tcard-inner">
              <div class="tcard-face tcard-front">
                <div class="sym">✦</div>
                <div>ПУШКИН.ОС</div>
                <div class="pos">${c.pos}</div>
              </div>
              <div class="tcard-face tcard-back">
                <div class="sym">${c.s}</div>
                <div class="nm">${c.n}</div>
              </div>
            </div>
          </div>`).join('')}
      </div>
      <div class="reading" id="reading"></div>
    </div>`;

  let flipped = 0;
  win.querySelectorAll('.tcard').forEach(card => {
    card.addEventListener('click', () => {
      if (card.classList.contains('flipped')) return;
      card.classList.add('flipped'); flipped++;
      if (flipped === 3) setTimeout(() => showTarotReading(win, spread, win.querySelector('#tarotQ').value), 700);
    });
  });
}

function showTarotReading(win, spread, question){
  const r = win.querySelector('#reading');
  let html = '';
  if(question.trim()){
    html += `<div style="margin-bottom:10px;font-weight:bold;color:#1a3324;padding-bottom:8px;border-bottom:1px solid #8b7d5b;">Твой вопрос: «${question.trim()}»</div>`;
  }
  html += '<b style="color:#1a3324;font-size:14px;font-family:Courier New;">📖 Толкование</b>';
  
  let badCount = 0; let goodCount = 0;
  spread.forEach(c => {
    if (c.type === 'bad') badCount++;
    if (c.type === 'good') goodCount++;
    html += `<h4>${c.pos} — ${c.s} ${c.n}</h4>
      <div style="font-size:13px;color:#4a4a4a;margin-bottom:10px;">${c.full}</div>`;
  });

  let synthesis = '';
  if (badCount >= 2) {
    synthesis = `⚠️ <b>Судьба предупреждает:</b> в твоём раскладе слишком много тревожных знаков. Сейчас не время для резких решений. Возьми паузу и прислушайся к себе.`;
  } else if (goodCount >= 2) {
    synthesis = `✨ <b>Судьба благоволит:</b> карты говорят, что ты на верном пути. Смело иди вперёд, твои усилия скоро принесут плоды.`;
  } else {
    synthesis = `⚖️ <b>Равновесие:</b> сейчас в твоей жизни полоса перемен. Нет явных побед или поражений, всё зависит от твоего выбора. Действуй обдуманно.`;
  }

  if (question.trim()) {
    synthesis += `<br><br>💡 <b>К твоему вопросу:</b> карта «${spread[1].n}» в настоящем подсказывает, что тебе стоит обратить внимание именно на это.`;
  }

  html += `<div class="total">${synthesis}</div>`;
  r.innerHTML = html;
  r.classList.add('show');

  if (!doneApps.has('tarot')) { doneApps.add('tarot'); saveState(); unlock('oracle'); updateProgress(); }
}

/* --- БАЛ --- */
function renderBall(win){
  const moves = [
    {id:0, ic:'🎩', name:'Поклон'},
    {id:1, ic:'👗', name:'Реверанс'},
    {id:2, ic:'💃', name:'Пируэт'},
    {id:3, ic:'🩰', name:'Арабеск'}
  ];

  let level = 1, maxLevel = 4, sequence = [], userInput = [], accepting = false;

  win.innerHTML = `
    <div class="titlebar"><span>💃 Бал.exe</span><button class="close">×</button></div>
    <div class="window-body">
      <div class="portrait"><img src="img/2.jpg" alt="Бал"></div>
      <p style="font-size:13px;color:#4a3b16;font-style:italic;text-align:center;">
        «Вот бал: весь в огнях...». Повтори движение.
      </p>
      <div class="ball-stage">
        <div class="ball-round" id="ballRound">УРОВЕНЬ 1 / ${maxLevel}</div>
        <div class="ball-status" id="ballStatus">Смотри...</div>
        <div class="ball-moves" id="ballMoves">
          ${moves.map(m => `
            <button class="ball-move" data-id="${m.id}" disabled>
              <span class="ic">${m.ic}</span><span>${m.name}</span>
            </button>`).join('')}
        </div>
      </div>
    </div>`;

  const statusEl = win.querySelector('#ballStatus');
  const roundEl  = win.querySelector('#ballRound');
  const buttons  = win.querySelectorAll('.ball-move');

  function randomMove(){ return Math.floor(Math.random()*4); }

  function playSequence(){
    accepting = false;
    buttons.forEach(b => b.disabled = true);
    statusEl.textContent = 'Смотри...';
    
    let i = 0;
    function nextStep() {
      if (i >= sequence.length) {
        accepting = true; userInput = [];
        buttons.forEach(b => b.disabled = false);
        statusEl.textContent = 'Твой ход!';
        return;
      }
      const btn = win.querySelector(`.ball-move[data-id="${sequence[i]}"]`);
      btn.classList.add('lit');
      
      setTimeout(() => {
        btn.classList.remove('lit');
        i++;
        // Пауза 200мс после выключения, чтобы даже двойное мигание было заметно
        setTimeout(nextStep, 200);
      }, 400); // Горит 400мс
    }
    
    setTimeout(nextStep, 400); // Начальная пауза перед первым миганием
  }

  function startRound(){
    sequence = [];
    for (let i = 0; i < level + 1; i++) sequence.push(randomMove());
    roundEl.textContent = `УРОВЕНЬ ${level} / ${maxLevel}`;
    setTimeout(playSequence, 500);
  }

  function finishWin(){
    const box = document.createElement('div');
    box.className = 'success-box';
    box.innerHTML = `<b>✓ БАЛ ЗАВЕРШЁН</b>Ты прошёл все фигуры.`;
    win.querySelector('.window-body').appendChild(box);
    buttons.forEach(b => b.disabled = true);
    statusEl.textContent = 'Победа!';
    if (!doneApps.has('ball')) { doneApps.add('ball'); saveState(); unlock('dancer'); updateProgress(); }
  }

  function finishLose(){
    const box = document.createElement('div');
    box.className = 'success-box';
    box.style.background = '#e6c1c1'; box.style.borderColor = '#7a2323'; box.style.color = '#4a0e0e';
    box.innerHTML = `<b>✗ СБИЛСЯ С РИТМА</b>Попробуй ещё раз!`;
    win.querySelector('.window-body').appendChild(box);
    buttons.forEach(b => b.disabled = true);
    statusEl.textContent = 'Конец танца.';
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (!accepting) return;
      const id = +btn.dataset.id;
      userInput.push(id);
      btn.classList.add('lit');
      setTimeout(() => btn.classList.remove('lit'), 200);

      const i = userInput.length - 1;
      if (userInput[i] !== sequence[i]) {
        accepting = false; buttons.forEach(b => b.disabled = true);
        setTimeout(finishLose, 500); return;
      }
      if (userInput.length === sequence.length) {
        accepting = false;
        if (level >= maxLevel) setTimeout(finishWin, 400);
        else {
          level++; statusEl.textContent = 'Отлично! Следующий...';
          setTimeout(startRound, 900);
        }
      }
    });
  });
  startRound();
}

/* --- ШИФР (ЭМОДЗИ-РЕБУС) --- */
function renderCipher(win){
  const cipherType = ['caesar1', 'caesar3', 'emoji'][Math.floor(Math.random()*3)];
  
  let displayContent = '';
  let helpHTML = '';
  let typeName = '';
  let answer = '';

  if (cipherType === 'caesar1') {
    typeName = 'Шифр Цезаря (+1)';
    helpHTML = `Каждая буква сдвинута на 1 вперед в алфавите (включая Ё).<br><br><b>Пример:</b> А → Б, Б → В... Я → А.`;
    answer = PROPHECIES[Math.floor(Math.random() * PROPHECIES.length)];
    displayContent = `<div class="cipher-box">${caesarEncode(answer, 1)}</div>`;
  } else if (cipherType === 'caesar3') {
    typeName = 'Шифр Цезаря (+3)';
    helpHTML = `Каждая буква сдвинута на 3 вперед в алфавите (включая Ё).<br><br><b>Пример:</b> А → Г, Б → Д... Я → В.`;
    answer = PROPHECIES[Math.floor(Math.random() * PROPHECIES.length)];
    displayContent = `<div class="cipher-box">${caesarEncode(answer, 3)}</div>`;
  } else {
    typeName = 'Эмодзи-Ребус';
    helpHTML = `Каждое эмодзи заменяет слово или часть слова.<br><br><b>Подсказка:</b> это известная строка Александра Сергеевича Пушкина.`;
    const riddle = EMOJI_RIDDLES[Math.floor(Math.random() * EMOJI_RIDDLES.length)];
    answer = riddle.a;
    displayContent = `<div class="cipher-box cipher-emoji">${riddle.q}</div>`;
  }

  win.innerHTML = `
    <div class="titlebar"><span>🔐 Тайнопись.exe</span><button class="close">×</button></div>
    <div class="window-body">
      <div class="portrait"><img src="img/3.jpg" alt="Шифр"></div>
      
      <div class="cipher-info">
        <b>📜 ${typeName}</b><br>
        ${helpHTML}
      </div>

      <p>Расшифруй строку и узнай предсказание.</p>

      ${displayContent}

      <div class="input-row">
        <input type="text" id="cipherInput" placeholder="Введи текст...">
        <button class="btn" id="cipherCheck">Проверить</button>
      </div>
      
      <div id="cipherResult"></div>
    </div>`;

  const input = win.querySelector('#cipherInput');
  const btn = win.querySelector('#cipherCheck');
  const res = win.querySelector('#cipherResult');
  
  const clean = (s) => s.toUpperCase().replace(/[^А-ЯЁ\s]/g, '').replace(/\s+/g, ' ').trim();
  const correctClean = clean(answer);

  btn.addEventListener('click', () => {
    if (clean(input.value) === correctClean) {
      btn.disabled = true; input.disabled = true;
      btn.style.background = '#2c4a35'; btn.style.color = '#86a38e'; btn.textContent = 'Верно!';
      
      res.innerHTML = `
        <div class="cipher-result">
          <b>✓ РАСШИФРОВАНО</b>
          «${answer}»<br><br>
          <span style="font-size:12px;">Пусть эта строка станет твоим предсказанием на сегодня.</span>
        </div>
      `;
      res.style.display = 'block';
      
      if (!doneApps.has('cipher')) { doneApps.add('cipher'); saveState(); unlock('hacker'); updateProgress(); }
    } else {
      input.style.borderColor = '#7a2323';
      setTimeout(() => input.style.borderColor = '#2c4a35 #fff #fff #2c4a35', 500);
      toast('✗ Неверно', 'Попробуй ещё раз.');
    }
  });
}

function caesarEncode(text, shift) {
  const alphabet = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ';
  return text.toUpperCase().split('').map(ch => {
    const idx = alphabet.indexOf(ch);
    if (idx === -1) return ch;
    return alphabet[(idx + shift) % alphabet.length];
  }).join('');
}

/* --- СЕКРЕТ --- */
function canUnlockSecret(){
  return fixedFiles.size === 6
    && doneApps.has('tarot')
    && doneApps.has('ball')
    && doneApps.has('cipher')
    && doneBranches.size === BRANCHES.length;
}

function checkAndUnlockSecret(){
  if (!canUnlockSecret()) return;
  const icon = document.querySelector('.icon.secret');
  if (icon && !icon.classList.contains('unlocked')) {
    icon.classList.add('unlocked');
    toast('📜 Секретный архив', 'Появился на рабочем столе');
  }
}

function renderSecret(win){
  win.classList.add('final');
  win.innerHTML = `
    <div class="titlebar"><span>📜 А.С.Пушкин.архив</span><button class="close">×</button></div>
    <div class="window-body">
      <div class="portrait"><img src="img/11.jpg" alt="Пушкин"></div>
      <p><b>Все процессы работают штатно.</b></p>
      <p>Герои вернулись на страницы. Строфы — на места. Сеть СЦДБ активна.</p>
      <p style="margin-top:16px; font-style:italic; color:#2c4a35;">
        «Что дружба? Лёгкий пыл похмелья...» — прошептал кто-то и растворился.
      </p>
      <p style="margin-top:20px;"><b>Спасибо, администратор.</b></p>
    </div>`;
  if (!gotAchv.has('legend')) setTimeout(() => unlock('legend'), 400);
}

function updateProgress(){
  const pr = document.getElementById('progress');
  pr.textContent = `Файлы: ${fixedFiles.size}/6 • Филиалы: ${doneBranches.size}/${BRANCHES.length} • Игры: ${doneApps.size}/3`;
}
